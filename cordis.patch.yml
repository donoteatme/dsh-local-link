# Adds one Host gateway and one Web client settings page without replacing any
# stock DeepSeek Harness module. The stock connection receives the gateway's
# LAN authorities through its public trustedHosts contract. Harness still keeps
# settings, credentials, native Host actions, and preset authoring loopback-only.
- id: connection
  inject: [localLinkGateway]
  config:
    trustedHosts: !!js "[...(ctx.root.webStartup?.trustedHosts ?? ctx.root.webRuntime?.trustedHosts ?? []), ...ctx.localLinkGateway.trustedHosts]"

- insert:
    - id: dsh-local-link
      name: dsh-local-link
      inject: [webServer]
      config:
        listenHost: 0.0.0.0
        listenPort: 3088
        upstreamOrigin: http://127.0.0.1:3080
        accessMode: pairing
        pairingTtlSeconds: 300
        deviceTtlDays: 90
        diagnosticsEnabled: true
        diagnosticsMaxEntries: 15
        diagnosticsFile: !!js dshHomePath('local-link/diagnostics.json')
        stateFile: !!js dshHomePath('local-link/devices.json')
